# Mosquitto MQTT Broker Configuration
# VPP Consumer Platform - Production Setup

# =============================================================================
# General Configuration
# =============================================================================

# Broker ID
clientid_prefixes vpp-

# Persistence
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection limits
max_connections 1000
max_queued_messages 1000

# =============================================================================
# Default Listener (Plain MQTT) - For Development Only
# =============================================================================

listener 1883
protocol mqtt
allow_anonymous false

# =============================================================================
# Secure Listener (MQTTS with TLS/SSL) - Production
# =============================================================================

listener 8883
protocol mqtt
allow_anonymous false

# SSL/TLS Configuration
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key

# Require client certificates (mutual TLS)
require_certificate false
use_identity_as_username false

# TLS version
tls_version tlsv1.2

# =============================================================================
# WebSocket Listener (WSS) - For Web Clients
# =============================================================================

listener 8884
protocol websockets
allow_anonymous false

cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key

# =============================================================================
# Authentication
# =============================================================================

# Password file authentication
password_file /etc/mosquitto/passwd

# Authentication plugin (optional - for database auth)
# auth_plugin /usr/lib/mosquitto_auth_plugin.so
# auth_opt_backends mysql
# auth_opt_host localhost
# auth_opt_port 3306
# auth_opt_dbname vpp_platform
# auth_opt_user mosquitto
# auth_opt_pass mosquitto_password

# =============================================================================
# Access Control Lists (ACL)
# =============================================================================

acl_file /etc/mosquitto/acl

# =============================================================================
# Bridge Configuration (Optional - for multi-region)
# =============================================================================

# connection bridge-to-cloud
# address mqtt.cloud.example.com:8883
# topic vpp/# out 0
# bridge_cafile /etc/mosquitto/certs/cloud-ca.crt
# bridge_certfile /etc/mosquitto/certs/bridge.crt
# bridge_keyfile /etc/mosquitto/certs/bridge.key

# =============================================================================
# Performance Tuning
# =============================================================================

# Message size limit (10MB)
message_size_limit 10485760

# Memory limit per client (256KB)
max_inflight_messages 20
max_queued_messages 1000

# Keepalive
keepalive_interval 60

# =============================================================================
# Security
# =============================================================================

# Disable protocol version 3.1 (use 3.1.1 or 5.0 only)
# protocol_version mqttv311

# Connection timeout
persistent_client_expiration 1h

# Disable retained messages for sensitive topics
# retained_persistence false
