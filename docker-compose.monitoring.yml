version: '3.8'

# VPP Platform Monitoring Stack
# Includes: Prometheus, Grafana, Alertmanager, OTel Collector,
#           Redis Exporter, Kafka Exporter, Node Exporter, Postgres Exporter
#
# Topology: app + middleware services live on the shared external network
# `vpp-platform-net` (created by docker-compose.middleware.yml — start that
# stack first, or run `docker network create vpp-platform-net`). This stack's
# own `monitoring` network is for the observability internals. Prometheus,
# Grafana, Alertmanager and the OTel collector sit on BOTH networks so they
# can reach app services (vpp-server, temporal, keycloak, apisix, ...) and
# the IoT stack (mqtt-fluvio-bridge, fluvio consumers) by container name.

networks:
  monitoring:
    driver: bridge
  vpp-network:
    external: true
    name: vpp-platform-net

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

services:
  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: vpp-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - vpp-network

  # Grafana - Visualization
  grafana:
    image: grafana/grafana-oss:latest
    container_name: vpp-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - monitoring
      - vpp-network
    depends_on:
      - prometheus

  # Alertmanager - Alert routing and notification
  alertmanager:
    image: prom/alertmanager:latest
    container_name: vpp-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      # Receiver secrets (Slack webhook URL, PagerDuty routing key, watchdog
      # webhook) are read from files at startup/reload — see
      # observability/README.md "Alerting secrets".
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring

  # OTel Collector — full definition duplicated from docker-compose.middleware.yml
  # so this stack is self-contained; when the compose files are layered
  # (middleware + monitoring + prod) the two entries merge.
  otel-collector:
    image: otel/opentelemetry-collector:0.116.0
    container_name: vpp-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    environment:
      OTEL_TENANT_ID: ${OTEL_TENANT_ID:-default}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-development}
      OTEL_RUM_ALLOWED_ORIGIN: ${OTEL_RUM_ALLOWED_ORIGIN:-http://localhost:8080}
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - monitoring
      - vpp-network

  # Redis Exporter - Redis metrics
  # Targets the redis container on the shared network (redis:6379), not the
  # host. Set REDIS_PASSWORD in .env when redis runs with --requirepass (prod).
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: vpp-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "9121:9121"
    networks:
      - monitoring
      - vpp-network

  # Kafka Exporter - Kafka metrics (consumer lag, broker/topic info)
  # kafka:29092 is the broker's INTERNAL advertised listener
  # (KAFKA_ADVERTISED_LISTENERS PLAINTEXT://kafka:29092 in the middleware stack).
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: vpp-kafka-exporter
    restart: unless-stopped
    command:
      - '--kafka.server=kafka:29092'
    ports:
      - "9308:9308"
    networks:
      - monitoring
      - vpp-network

  # Postgres Exporter - platform database metrics (pg_up, pg_stat_activity_*)
  # The `postgres` service is defined in docker-compose.prod.yml; in a pure
  # dev middleware boot there is no platform DB and pg_up will be 0, which is
  # an honest signal (the PostgresDown alert will fire). Override with
  # POSTGRES_EXPORTER_DSN to point at another database.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: vpp-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-postgresql://${POSTGRES_USER:-vpp}:${POSTGRES_PASSWORD:-vpp}@postgres:5432/${POSTGRES_DB:-vpp}?sslmode=disable}
    ports:
      - "9187:9187"
    networks:
      - monitoring
      - vpp-network

  # Node Exporter - System metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: vpp-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
