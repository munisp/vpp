    authority: docker-compose.prod.yml; DEPLOYMENT.md; .env.example
    component: Docker compose deployment and observability configuration
    entry_points:
      - docker-compose.prod.yml
      - docker-compose.middleware.yml
      - docker-compose.monitoring.yml
    production_configuration:
      - docker-compose.prod.yml
      - .env.example
    evidence_required:
      - compose configuration validation
      - isolated deployment
      - readiness and rollback test
      - backup/restore rehearsal
    status: blocked
    reason: No production-shaped compose deployment, backup/restore rehearsal, or rollback test has been executed in this assessment.
