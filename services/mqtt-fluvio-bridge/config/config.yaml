mqtt:
  broker_url: "ssl://localhost:8883"
  client_id: "mqtt-fluvio-bridge"
  username: "vpp_bridge"
  password: "changeme"
  topics:
    - "vpp/telemetry/+"
    - "vpp/devices/+/status"
  qos: 1
  clean_session: false
  use_tls: true
  ca_file: "/path/to/ca.crt"
  cert_file: "/path/to/client.crt"
  key_file: "/path/to/client.key"

stream:
  # "fluvio" publishes through the `fluvio` CLI (there is no Go SDK);
  # "kafka" publishes to the same brokers the Node services use.
  transport: "kafka"
  default_topic: "telemetry.raw"

fluvio:
  endpoint: "localhost:9003"
  cli_path: "fluvio"
  # Must match `fluvio profile current`; the CLI has no per-command profile flag.
  profile: ""
  partitions: 1
  create_missing_topics: false
  topics:
    "vpp/telemetry/+": "telemetry"
    "vpp/devices/+/status": "device-status"

kafka:
  brokers:
    - "localhost:9092"
  tls: false
  sasl_mechanism: ""
  sasl_username: ""
  sasl_password: ""
  required_acks: "all"
  create_missing_topics: false
  partitions: 3
  replication_factor: 1
  topics:
    "vpp/telemetry/+": "telemetry.raw"
    "vpp/devices/+/status": "edge.connectivity"

bridge:
  worker_count: 4
  buffer_size: 1000
  enable_validation: true
  log_level: "info"
  # Prometheus metrics + /healthz listen address (METRICS_ADDR overrides).
  # The monitoring stack scrapes mqtt-fluvio-bridge:8080/metrics.
  metrics_addr: ":8080"

# OpenTelemetry traces (environment variables, not YAML):
#   OTEL_EXPORTER_OTLP_ENDPOINT  e.g. http://localhost:4317 (unset = disabled, logged at boot)
#   OTEL_SERVICE_NAME / OTEL_SERVICE_VERSION / OTEL_ENVIRONMENT / OTEL_TENANT_ID
#   OTEL_SDK_DISABLED=true       escape hatch: force no-op telemetry
