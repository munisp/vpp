[package]
name = "modbus-poller"
version = "0.1.0"
edition = "2021"
description = "Modbus TCP/RTU poller for VPP field devices (inverters, meters, battery controllers)"
license = "MIT"

[dependencies]
anyhow = "1.0.86"
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
sha2 = "0.10.8"
tokio = { version = "1.38.0", features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-modbus = { version = "0.17.0", default-features = false, features = ["tcp", "rtu"] }
tokio-serial = "5.4.4"
toml = "0.8.14"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json", "registry"] }

# OpenTelemetry: a matched set — tracing-opentelemetry 0.29 is built against
# opentelemetry / opentelemetry-sdk / opentelemetry-otlp / opentelemetry-http
# 0.28 and works with the pinned tracing 0.1.40.
opentelemetry = "0.28"
opentelemetry_sdk = "0.28"
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry-http = "0.28"
tracing-opentelemetry = "0.29"

[dev-dependencies]
tokio-modbus = { version = "0.17.0", default-features = false, features = ["tcp", "rtu", "server", "tcp-server"] }
