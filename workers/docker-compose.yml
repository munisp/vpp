version: '3.8'

services:
  # Temporal Server (for local development)
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    depends_on:
      - postgresql
    networks:
      - temporal-network

  postgresql:
    image: postgres:13
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    networks:
      - temporal-network

  # ------------------------------------------------------------------
  # RETIRED duplicate workers — do not re-add.
  #
  # The dr-worker (Go), trading-worker (Python) and payment-worker (Python)
  # services that used to be defined here polled the same Temporal task
  # queues the TypeScript workers own (payment-processing, trading-execution)
  # or a queue nothing publishes to (dr-events), and registered workflow
  # type names that do not match what the server dispatches (e.g.
  # `PaymentProcessingWorkflow` vs the dispatched `processPayment`,
  # `AutomatedTradingWorkflow` vs `automatedTradingWorkflow`). Running them
  # alongside the TS workers failed tasks non-deterministically.
  #
  # The live workers are the TypeScript ones:
  #   server/workflows/worker.ts          -> payment-processing
  #   server/workflows/dr-worker.ts       -> dr-orchestration
  #   server/workflows/trading-worker.ts  -> trading-execution
  #   server/workflows/prepaid-worker.ts  -> prepaid-issuance
  # deployed in docker-compose.prod.yml. The Python/Go entrypoints under
  # payment-worker/, trading-worker/ and dr-worker/ are kept for reference
  # only and log a retirement warning at boot.
  # ------------------------------------------------------------------

networks:
  temporal-network:
    driver: bridge
