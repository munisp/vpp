# Example configuration for the grid protocol service (cmd/gridd).
#
# Every protocol is opt-in and each enabled protocol must be fully configured;
# the service refuses to start otherwise rather than reporting a connection it
# cannot make. Secrets belong in the environment (see the override names in
# config/config.go), not in a committed file.

listen: ":9100"
log_level: "info"

platform:
  # The VPP server. Protocol messages are POSTed to /api/grid/* with an
  # HMAC-SHA256 signature over "<unix timestamp>.<body>".
  base_url: "http://vpp-server:3000"
  shared_secret: "" # GRID_PROTOCOL_SHARED_SECRET, >= 32 characters
  timeout: 15s

ocpp:
  enabled: true
  # Versions this deployment terminates. A station is routed by the WebSocket
  # subprotocol it offers ("ocpp1.6" / "ocpp2.0.1"); a version that is not
  # listed here is refused, never served with the other version's message set.
  versions: ["1.6", "2.0.1"]
  # Security profile 1: HTTP basic auth over TLS, for both versions. An empty
  # map means no charge point can connect, which is the safe default.
  charge_points:
    CP-0001: "" # >= 16 characters
  heartbeat_interval: 300s
  call_timeout: 30s

control:
  # No setpoint this service delivers may outlive this window: the bound is sent
  # to the charge point as validFrom/validTo, so hardware stops obeying on its
  # own clock if the platform disappears. Capped at 24h.
  max_validity: 1h
  # How often expired windows are swept and the standing safe fallback profile is
  # re-asserted. Must be shorter than max_validity.
  sweep_interval: 30s

openadr:
  enabled: false
  vtn_base_url: "https://vtn.utility.example/OpenADR2/Simple/2.0b"
  ven_name: "vpp-ven"
  ven_id: "" # assigned by the VTN at registration
  registration_id: "" # assigned by the VTN at registration
  username: ""
  password: ""
  client_cert_file: ""
  client_key_file: ""
  ca_file: ""
  poll_interval: 60s

sep2:
  enabled: false
  # IEEE 2030.5 requires HTTPS with a client certificate; the LFDI is derived
  # from the SHA-256 of the DER certificate.
  base_url: "https://sep2.utility.example"
  client_cert_file: "/etc/vpp/sep2-client.pem"
  client_key_file: "/etc/vpp/sep2-client.key"
  ca_file: "/etc/vpp/sep2-ca.pem"
  poll_interval: 300s

matter:
  enabled: false
  # A Matter controller exposing the WebSocket controller API (for example
  # matter-server on :5580). This service embeds no Matter stack: without a
  # controller it refuses to start rather than reporting commissioned nodes.
  url: "ws://matter-server:5580/ws"
  call_timeout: 30s
  reconnect_interval: 10s
  # The controller's synthetic nodes (id >= 900000) acknowledge commands that no
  # device performs. Leave this off outside a development fabric: those
  # acknowledgements are indistinguishable from a dispatched load.
  allow_test_nodes: false
