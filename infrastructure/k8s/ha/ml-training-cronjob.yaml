---
# Weekly ML training/retraining job (services/ml, the vppml package).
#
# Without a scheduled trainer, services/ml is a library nothing runs: the
# server reads model artifacts via ML_ARTIFACT_DIR
# (server/services/ml/model-health.ts reports them unverified when absent),
# but nothing ever trains. This CronJob runs `vppml.cli tick`, the continuous
# loop that claims and runs the retraining that is due
# (services/ml/vppml/cli.py) — it exits non-zero when a claimed run failed, so
# a declined or failed training is visible as a failed Job, not a log line.
#
# The artifact PVC below must be the SAME volume the API mounts at its own
# ML_ARTIFACT_DIR, or the API will report every production model unverified.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-artifacts
  namespace: vpp-platform
  labels:
    app.kubernetes.io/name: ml-training
    app.kubernetes.io/part-of: vpp-platform
spec:
  accessModes:
    - ReadWriteMany  # the API mounts this too (see note above)
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-training
  namespace: vpp-platform
  labels:
    app.kubernetes.io/name: ml-training
    app.kubernetes.io/part-of: vpp-platform
spec:
  # Weekly, Sunday 02:00 UTC. Training reads a trailing window of meter data,
  # so weekly keeps models fresh without retraining on partial days.
  schedule: "0 2 * * 0"
  # vppml tick claims retraining work before running it, but Forbid keeps the
  # schedule honest anyway.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 20
  jobTemplate:
    spec:
      backoffLimit: 1
      # Training over a long window can be slow; a killed run leaves its
      # checkpoint and the next tick resumes or retries it.
      activeDeadlineSeconds: 21600  # 6h
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ml-training
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: train
              # Build from services/ml (vppml + requirements.txt); no image is
              # published by this repository, so pin your registry here.
              image: ${ML_TRAINING_IMAGE}
              imagePullPolicy: IfNotPresent
              args: ["tick"]
              command: ["python", "-m", "vppml.cli"]
              env:
                # Training data source. A read role plus write access to the
                # vppml registry/checkpoint tables is enough.
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      # Same secret the API deployment uses
                      # (infrastructure/k8s/ha/kubernetes-base-ha.yaml).
                      name: vpp-db-credentials
                      key: url
                # Must equal the path mounted below AND the API's
                # ML_ARTIFACT_DIR (different volume, same logical store).
                - name: ML_ARTIFACT_DIR
                  value: /var/lib/vpp/ml-artifacts
                - name: ML_RUNNER
                  value: "k8s-cronjob"
                # No Ray cluster in this stack: compute stays in-process.
                - name: RAY_ADDRESS
                  value: "local"
                # LAKEHOUSE_STORE is deliberately unset: lake access is
                # optional in vppml (training then refuses lakehouse-origin
                # datasets explicitly), and setting it to "s3" without the
                # bucket/credential variables would fail config loading.
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "4"
                  memory: "8Gi"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: artifacts
                  mountPath: /var/lib/vpp/ml-artifacts
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: artifacts
              persistentVolumeClaim:
                claimName: ml-artifacts
            - name: tmp
              emptyDir: {}
