version: '3.9'

services:
  # ============================================================================
  # Kafka & Zookeeper
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: vpp-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - vpp-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: vpp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - vpp-network

  # ============================================================================
  # Redis
  # ============================================================================
  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: vpp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - vpp-network

  # ============================================================================
  # Temporal
  # ============================================================================
  temporal:
    image: temporalio/auto-setup:1.22.0
    hostname: temporal
    container_name: vpp-temporal
    depends_on:
      - temporal-postgresql
    ports:
      - "7233:7233"
      - "8000:8000"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      # Uses the dynamicconfig baked into the auto-setup image (the previous
      # ./middleware/temporal/dynamicconfig mount pointed at a directory that
      # does not exist in this repo).
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      # Temporal 1.22 serves Prometheus metrics at http://temporal:8000/metrics
      # when PROMETHEUS_ENDPOINT is set. Scraped by Prometheus (job
      # temporal-server) and by the OTel collector prometheus/infra receiver.
      - PROMETHEUS_ENDPOINT=0.0.0.0:8000
    networks:
      - vpp-network

  temporal-postgresql:
    image: postgres:15-alpine
    hostname: temporal-postgresql
    container_name: vpp-temporal-db
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - vpp-network

  temporal-ui:
    image: temporalio/ui:2.21.0
    hostname: temporal-ui
    container_name: vpp-temporal-ui
    depends_on:
      - temporal
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    networks:
      - vpp-network

  # ============================================================================
  # Keycloak
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    hostname: keycloak
    container_name: vpp-keycloak
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgresql:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      # Expose /health and /metrics on the HTTP port (Keycloak 23 serves them
      # on 8080; the 9000 management interface only exists in KC >= 25).
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
    depends_on:
      - keycloak-postgresql
    networks:
      - vpp-network

  keycloak-postgresql:
    image: postgres:15-alpine
    hostname: keycloak-postgresql
    container_name: vpp-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - vpp-network

  # ============================================================================
  # Permify
  # ============================================================================
  permify:
    image: ghcr.io/permify/permify:latest
    hostname: permify
    container_name: vpp-permify
    ports:
      - "3476:3476"
      - "3478:3478"
    command: serve
    environment:
      - PERMIFY_DATABASE_ENGINE=postgres
      - PERMIFY_DATABASE_URI=postgres://permify:permify@permify-postgresql:5432/permify?sslmode=disable
      - PERMIFY_LOG_LEVEL=info
      # Permify has NO Prometheus endpoint. It pushes traces and metrics over
      # OTLP to the collector (same wiring as infrastructure/k8s/ha/permify-ha.yaml);
      # the collector re-exports the metrics at otel-collector:8889.
      - PERMIFY_TRACER_ENABLED=true
      - PERMIFY_TRACER_EXPORTER=otlp
      - PERMIFY_TRACER_ENDPOINT=otel-collector:4317
      - PERMIFY_TRACER_INSECURE=true
      - PERMIFY_METER_ENABLED=true
      - PERMIFY_METER_EXPORTER=otlp
      - PERMIFY_METER_ENDPOINT=otel-collector:4317
      - PERMIFY_METER_INSECURE=true
    depends_on:
      - permify-postgresql
    networks:
      - vpp-network

  permify-postgresql:
    image: postgres:15-alpine
    hostname: permify-postgresql
    container_name: vpp-permify-db
    environment:
      POSTGRES_USER: permify
      POSTGRES_PASSWORD: permify
      POSTGRES_DB: permify
    volumes:
      - permify-postgres-data:/var/lib/postgresql/data
    networks:
      - vpp-network

  # ============================================================================
  # APISIX
  # ============================================================================
  apisix:
    image: apache/apisix:3.7.0-debian
    hostname: apisix
    container_name: vpp-apisix
    ports:
      - "9080:9080"
      - "9091:9091"
      - "9443:9443"
    # The previous mounts pointed at ./middleware/apisix/* which does not exist
    # in this repo. APISIX's image-default conf/config.yaml is etcd-backed and
    # already lists the `prometheus` plugin, which serves
    # http://apisix:9080/apisix/prometheus/metrics (scraped by Prometheus and
    # the OTel collector). Routes are managed via the Admin API (:9091) /
    # infrastructure/k8s/ha/apisix-ha.yaml in k8s; the reference standalone
    # config infrastructure/apisix-config.yaml is NOT mounted here because its
    # upstreams (consumer-platform, nextgen-api, kafka-rest) don't exist in
    # this stack.
    depends_on:
      - etcd
    networks:
      - vpp-network

  etcd:
    image: bitnami/etcd:3.5
    hostname: etcd
    container_name: vpp-etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - vpp-network

  # ============================================================================
  # TigerBeetle
  # ============================================================================
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    hostname: tigerbeetle
    container_name: vpp-tigerbeetle
    # TigerBeetle has NO Prometheus/HTTP metrics endpoint. Its only metrics
    # output is StatsD (DogStatsD format), and --statsd requires a literal
    # IP:port (no DNS), which is why tigerbeetle-statsd below pins
    # 172.31.255.10 on this network. See observability/README.md.
    command: start --experimental --statsd=172.31.255.10:9125 --addresses=0.0.0.0:3000 /var/lib/tigerbeetle/0_0.tigerbeetle
    ports:
      - "3001:3000"
    volumes:
      - tigerbeetle-data:/var/lib/tigerbeetle
    networks:
      - vpp-network
    depends_on:
      - tigerbeetle-statsd

  # Turns TigerBeetle's StatsD/DogStatsD stream (tb.* metrics, tagged
  # cluster/replica) into a Prometheus endpoint at :9102/metrics. Scraped as
  # job `tigerbeetle`. The fixed IP is required by tigerbeetle's --statsd flag.
  tigerbeetle-statsd:
    image: prom/statsd-exporter:v0.26.1
    hostname: tigerbeetle-statsd
    container_name: vpp-tigerbeetle-statsd
    ports:
      - "9102:9102"
    networks:
      vpp-network:
        ipv4_address: 172.31.255.10

  # ============================================================================
  # MinIO (Lakehouse Storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: vpp-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - vpp-network

  # ============================================================================
  # Dapr
  # ============================================================================
  dapr-placement:
    image: daprio/dapr:1.12.0
    hostname: dapr-placement
    container_name: vpp-dapr-placement
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"
    networks:
      - vpp-network

  # ============================================================================
  # Fluvio
  # ============================================================================
  fluvio:
    image: infinyon/fluvio:latest
    hostname: fluvio
    container_name: vpp-fluvio
    command: cluster start --local
    ports:
      - "9003:9003"
    volumes:
      - fluvio-data:/home/fluvio/.fluvio
    networks:
      - vpp-network

  # ============================================================================
  # Observability (traces). Metrics (Prometheus/Grafana/Alertmanager/exporters)
  # live in docker-compose.monitoring.yml — the duplicate prometheus/grafana
  # services that used to be here mounted ./middleware/prometheus and
  # ./middleware/grafana, directories that never existed in this repo, so they
  # could never start. Run the monitoring compose alongside this one instead.
  # ============================================================================

  # Trace backend. All-in-one >= 1.35 with COLLECTOR_OTLP_ENABLED=true accepts
  # OTLP/gRPC on 4317 — that is what the otel-collector's otlp/jaeger exporter
  # targets. UI on 16686. The legacy jaeger-agent/zipkin ports were removed:
  # nothing in this repo speaks those protocols.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    hostname: jaeger
    container_name: vpp-jaeger
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - vpp-network

  # Central OTel collector: OTLP in (gRPC 4317 / HTTP 4318 with CORS for
  # browser RUM), traces -> jaeger:4317, metrics re-exported on :8889,
  # own pipeline telemetry on :8888. Config: observability/otel-collector-config.yaml.
  otel-collector:
    image: otel/opentelemetry-collector:0.116.0
    hostname: otel-collector
    container_name: vpp-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      OTEL_TENANT_ID: ${OTEL_TENANT_ID:-default}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-development}
      OTEL_RUM_ALLOWED_ORIGIN: ${OTEL_RUM_ALLOWED_ORIGIN:-http://localhost:8080}
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    # No healthcheck: the collector image is scratch-based (no shell/wget).
    # Liveness is observable via the health_check extension on :13133.
    networks:
      - vpp-network

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  redis-data:
  temporal-postgres-data:
  keycloak-postgres-data:
  permify-postgres-data:
  tigerbeetle-data:
  minio-data:
  fluvio-data:

networks:
  # Fixed name + fixed subnet: the other compose stacks (monitoring, services)
  # join this network as `external` so Prometheus, the OTel collector and the
  # IoT pipeline can resolve each other's container names across stacks, and
  # tigerbeetle-statsd can pin 172.31.255.10 (tigerbeetle --statsd needs a
  # literal IP). If the network already exists without these labels, recreate:
  #   docker network rm vpp-platform-net && docker compose -f docker-compose.middleware.yml up -d
  vpp-network:
    name: vpp-platform-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.255.0/24
