version: '3.8'

services:
  # Fluvio cluster (single node for development)
  fluvio:
    image: infinyon/fluvio:latest
    container_name: fluvio
    ports:
      - "9003:9003"
    environment:
      - RUST_LOG=info
    volumes:
      - fluvio-data:/var/lib/fluvio
    networks:
      - vpp-network

  # Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ../mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ../mqtt/certs:/mosquitto/certs
      - ../mqtt/data:/mosquitto/data
      - ../mqtt/log:/mosquitto/log
    networks:
      - vpp-network

  # MQTT-Fluvio Bridge (Go)
  mqtt-fluvio-bridge:
    build:
      context: ./mqtt-fluvio-bridge
      dockerfile: Dockerfile
    container_name: mqtt-fluvio-bridge
    depends_on:
      - mosquitto
      - fluvio
    environment:
      - MQTT_BROKER_URL=ssl://mosquitto:8883
      - FLUVIO_ENDPOINT=fluvio:9003
      # The bridge config (mqtt-fluvio-bridge/config/config.yaml) defaults
      # stream.transport to kafka, but the consumers in this same compose file
      # (database-consumer, analytics-consumer) read the Fluvio topic
      # `telemetry` — with kafka transport the chain is broken by default.
      # Fluvio transport produces `telemetry` (from vpp/telemetry/+) and
      # `device-status` (from vpp/devices/+/status); `device-status` currently
      # has no consumer in this stack — the mapping is kept so edge status is
      # recorded for a future consumer rather than dropped.
      # NOTE: the fluvio transport shells out to the `fluvio` CLI, which must
      # be present in the bridge image (mqtt-fluvio-bridge/Dockerfile).
      - STREAM_TRANSPORT=fluvio
      # OpenTelemetry contract: OTLP to the platform collector on the shared
      # vpp-platform-net network (see observability/README.md). Prometheus
      # metrics are served on :8080/metrics by the bridge itself.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=mqtt-fluvio-bridge
      - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-development}
      - OTEL_TENANT_ID=${OTEL_TENANT_ID:-default}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
    volumes:
      - ./mqtt-fluvio-bridge/config:/root/config
      - ../mqtt/certs:/root/certs
    networks:
      - vpp-network
    restart: unless-stopped

  # Database Consumer (Python)
  database-consumer:
    build:
      context: ./fluvio-consumers
      dockerfile: Dockerfile
    container_name: database-consumer
    command: python database/consumer.py
    depends_on:
      - fluvio
    environment:
      - FLUVIO_TOPIC=telemetry
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-vpp}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=fluvio-database-consumer
      - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-development}
      - OTEL_TENANT_ID=${OTEL_TENANT_ID:-default}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
    volumes:
      - ./fluvio-consumers/logs:/app/logs
    networks:
      - vpp-network
    restart: unless-stopped

  # Analytics Consumer (Python)
  analytics-consumer:
    build:
      context: ./fluvio-consumers
      dockerfile: Dockerfile
    container_name: analytics-consumer
    command: python analytics/consumer.py
    depends_on:
      - fluvio
    environment:
      - FLUVIO_TOPIC=telemetry
      - WINDOW_SIZE_SECONDS=60
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=fluvio-analytics-consumer
      - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-development}
      - OTEL_TENANT_ID=${OTEL_TENANT_ID:-default}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
    volumes:
      - ./fluvio-consumers/logs:/app/logs
    networks:
      - vpp-network
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - vpp-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/vpp.json
    depends_on:
      - prometheus
    networks:
      - vpp-network

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - vpp-network

  # MySQL Exporter. This stack's database is MySQL on :3306 (see the
  # consumers' DB_* env above); the previous scrape config targeted a
  # postgres-exporter that never existed here. The DSN is a single
  # overridable var and defaults to the same coordinates the consumers use.
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    ports:
      - "9104:9104"
    environment:
      # Override MYSQLD_EXPORTER_DSN with the real credentials/host for the
      # deployment, e.g. root:secret@(my-db-host:3306)/ — the default only
      # matches a local dev MySQL with an exporter-readable account.
      - DATA_SOURCE_NAME=${MYSQLD_EXPORTER_DSN:-root:exporter@(localhost:3306)/}
    networks:
      - vpp-network
    restart: unless-stopped

volumes:
  fluvio-data:
  prometheus-data:
  grafana-data:

networks:
  # Shared with the middleware/monitoring stacks so the platform Prometheus
  # and OTel collector can reach mqtt-fluvio-bridge and the consumers by
  # container name. Create once with:
  #   docker network create vpp-platform-net
  # (or boot docker-compose.middleware.yml first, which creates it).
  vpp-network:
    external: true
    name: vpp-platform-net
