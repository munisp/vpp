# open-appsec NGINX attachment site config.
# The nginx-attachment image loads the open-appsec attachment module globally;
# every server{} block here is inspected by appsec-agent via /dev/shm IPC.
#
# STATUS: reverse-proxy in front of nothing yet, by design (2026-08).
# When the platform gateway (APISIX) or another upstream should be protected,
# replace the `return 204` below with a proxy_pass to that upstream, e.g.:
#     location / { proxy_pass http://apisix:9080; }
# and route public traffic through appsec-nginx (ports 8088/8443 by default).

server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "appsec-nginx ok\n";
    }

    # Placeholder vhost: no upstream wired yet. Returns 204 so the listener
    # is verifiably alive without proxying to a non-existent backend.
    location / {
        return 204;
    }
}
