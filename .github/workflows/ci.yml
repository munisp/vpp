name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node:
    name: Node.js (typecheck, tests, client build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager"; specifying it here too
      # makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build client (Vite/esbuild)
        run: pnpm build:client

      - name: Build server bundle (esbuild)
        run: pnpm build:server

  python-workers:
    name: Python workers (py_compile + pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker:
          - payment-worker
          - trading-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/${{ matrix.worker }}/requirements.txt

      - name: Install dependencies
        working-directory: workers/${{ matrix.worker }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: py_compile all sources
        working-directory: workers/${{ matrix.worker }}
        run: python -m compileall -q .

      - name: pytest
        working-directory: workers/${{ matrix.worker }}
        run: |
          if ls test_*.py *_test.py >/dev/null 2>&1; then
            python -m pytest -v
          else
            echo "No pytest test files in ${{ matrix.worker }}, skipping."
          fi

  optimizer:
    name: Dispatch optimizer (compileall + pytest + benchmark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/optimizer/requirements.txt

      - name: Install dependencies
        working-directory: services/optimizer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: py_compile all sources
        working-directory: services/optimizer
        run: python -m compileall -q optimizer tests benchmarks

      - name: pytest
        working-directory: services/optimizer
        run: python -m pytest -v

      - name: Benchmark (reproducible, fixed seed)
        working-directory: services/optimizer
        run: python -m benchmarks.run --quick

  gridmodel:
    name: Network feasibility (compileall + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gridmodel/requirements.txt

      - name: Install dependencies
        working-directory: services/gridmodel
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: py_compile all sources
        working-directory: services/gridmodel
        run: python -m compileall -q gridmodel tests

      - name: pytest
        working-directory: services/gridmodel
        run: python -m pytest -v

  lakehouse:
    name: Lakehouse ingestion (compileall + pytest against PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vpp
          POSTGRES_PASSWORD: vpp
          POSTGRES_DB: vpp_lake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpp -d vpp_lake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/lakehouse/requirements.txt

      - name: Install dependencies
        working-directory: services/lakehouse
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: py_compile all sources
        working-directory: services/lakehouse
        run: python -m compileall -q lakehouse tests

      # The DSN is required, not optional: without it the pipeline tests skip, and a
      # skipped run would report green without having verified that a watermark only
      # moves after the object was read back.
      - name: pytest
        working-directory: services/lakehouse
        env:
          LAKEHOUSE_TEST_DSN: postgres://vpp:vpp@127.0.0.1:5432/vpp_lake
        run: python -m pytest -v

  go-orchestrator:
    name: Go orchestrator (build + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: |
            orchestrator/go.mod
            services/mqtt-fluvio-bridge/go.mod

      # confluent-kafka-go links against the system librdkafka.
      - name: Install librdkafka
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev

      # go.sum is intentionally not committed; resolve modules reproducibly.
      - name: Resolve modules
        working-directory: orchestrator
        run: |
          go mod download
          go mod tidy

      - name: Build
        working-directory: orchestrator
        run: go build ./...

      - name: Vet
        working-directory: orchestrator
        run: go vet ./...

  go-mqtt-fluvio-bridge:
    name: Go mqtt-fluvio-bridge (build + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: services/mqtt-fluvio-bridge/go.mod

      - name: Resolve modules
        working-directory: services/mqtt-fluvio-bridge
        run: go mod download

      - name: Build
        working-directory: services/mqtt-fluvio-bridge
        run: go build ./...

      - name: Vet
        working-directory: services/mqtt-fluvio-bridge
        run: go vet ./...

      - name: Test
        working-directory: services/mqtt-fluvio-bridge
        run: go test ./...

  go-grid-protocols:
    name: Go grid protocols (build + vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: services/grid-protocols/go.mod

      - name: Resolve modules
        working-directory: services/grid-protocols
        run: go mod download

      - name: Build
        working-directory: services/grid-protocols
        run: go build ./...

      - name: Vet
        working-directory: services/grid-protocols
        run: go vet ./...

      - name: Test
        working-directory: services/grid-protocols
        run: go test ./...

  rust-modbus-poller:
    name: Rust modbus poller (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/modbus-poller

      - name: Format check
        working-directory: services/modbus-poller
        run: cargo fmt --check

      - name: Clippy
        working-directory: services/modbus-poller
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: services/modbus-poller
        run: cargo test

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: a scan of the tip would miss a credential that was
      # committed and then removed, which is exactly the case that matters
      # before a repository is made public.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree and non-baselined history
        run: ./scripts/secret-scan.sh

  sbom:
    name: SBOM (SPDX + CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install syft
        run: |
          curl -sfL "https://github.com/anchore/syft/releases/download/v1.18.1/syft_1.18.1_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin syft
          syft version

      # Scanned from the checkout rather than from installed dependencies, so the
      # bill of materials covers every ecosystem in the repository at once:
      # pnpm-lock.yaml, the Go modules, Cargo.lock and the services' requirements.
      - name: Generate SBOM
        run: |
          syft scan "dir:." \
            --exclude './node_modules' \
            --exclude './dist' \
            --exclude './**/.venv' \
            --exclude './**/node_modules' \
            -o "spdx-json=sbom.spdx.json" \
            -o "cyclonedx-json=sbom.cdx.json"

      - name: Summarise
        run: |
          python3 - <<'PY'
          import json
          with open("sbom.spdx.json", encoding="utf-8") as fh:
              packages = json.load(fh)["packages"]
          if len(packages) < 100:
              raise SystemExit(
                  f"SBOM lists only {len(packages)} packages; the scan almost "
                  "certainly missed an ecosystem rather than the repository "
                  "having no dependencies"
              )
          print(f"{len(packages)} packages")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
          if-no-files-found: error
