# APISIX HA Configuration
# Multi-replica gateway with etcd cluster for configuration storage
---
apiVersion: v1
kind: Namespace
metadata:
  name: apisix
  labels:
    app.kubernetes.io/name: apisix
---
# etcd StatefulSet for APISIX configuration storage
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: apisix
spec:
  serviceName: etcd-headless
  replicas: 3
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - etcd
              topologyKey: kubernetes.io/hostname
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.11
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          env:
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCD_DATA_DIR
              value: /var/lib/etcd
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: new
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: apisix-etcd-cluster
            - name: ETCD_INITIAL_CLUSTER
              value: etcd-0=http://etcd-0.etcd-headless.apisix.svc.cluster.local:2380,etcd-1=http://etcd-1.etcd-headless.apisix.svc.cluster.local:2380,etcd-2=http://etcd-2.etcd-headless.apisix.svc.cluster.local:2380
            - name: ETCD_LISTEN_PEER_URLS
              value: http://0.0.0.0:2380
            - name: ETCD_LISTEN_CLIENT_URLS
              value: http://0.0.0.0:2379
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: http://$(ETCD_NAME).etcd-headless.apisix.svc.cluster.local:2379
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: http://$(ETCD_NAME).etcd-headless.apisix.svc.cluster.local:2380
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: "1"
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: "8589934592"
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
          livenessProbe:
            httpGet:
              path: /health
              port: 2379
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 2379
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 10Gi
---
# etcd Headless Service
apiVersion: v1
kind: Service
metadata:
  name: etcd-headless
  namespace: apisix
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
---
# etcd Service
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: apisix
spec:
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
  type: ClusterIP
---
# APISIX ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: apisix
data:
  config.yaml: |
    apisix:
      node_listen: 9080
      enable_ipv6: false
      enable_admin: true
      admin_key:
        - name: admin
          key: "${APISIX_ADMIN_KEY}"
          role: admin
      ssl:
        enable: true
        listen_port: 9443
      router:
        http: radixtree_uri
        ssl: radixtree_sni
      
    nginx_config:
      error_log: /dev/stderr
      error_log_level: warn
      worker_processes: auto
      worker_rlimit_nofile: 20480
      event:
        worker_connections: 10620
      http:
        access_log: /dev/stdout
        keepalive_timeout: 60s
        client_header_timeout: 60s
        client_body_timeout: 60s
        send_timeout: 10s
        underscores_in_headers: "on"
        real_ip_header: X-Real-IP
        real_ip_from:
          - 127.0.0.1
          - "unix:"
    
    etcd:
      host:
        - "http://etcd-0.etcd-headless.apisix.svc.cluster.local:2379"
        - "http://etcd-1.etcd-headless.apisix.svc.cluster.local:2379"
        - "http://etcd-2.etcd-headless.apisix.svc.cluster.local:2379"
      prefix: /apisix
      timeout: 30
    
    plugins:
      - api-breaker
      - authz-keycloak
      - basic-auth
      - batch-requests
      - consumer-restriction
      - cors
      - echo
      - fault-injection
      - grpc-transcode
      - hmac-auth
      - http-logger
      - ip-restriction
      - jwt-auth
      - kafka-logger
      - key-auth
      - limit-conn
      - limit-count
      - limit-req
      - node-status
      - openid-connect
      - prometheus
      - proxy-cache
      - proxy-mirror
      - proxy-rewrite
      - redirect
      - referer-restriction
      - request-id
      - request-validation
      - response-rewrite
      - serverless-post-function
      - serverless-pre-function
      - sls-logger
      - syslog
      - tcp-logger
      - udp-logger
      - uri-blocker
      - wolf-rbac
      - zipkin
    
    plugin_attr:
      prometheus:
        export_uri: /apisix/prometheus/metrics
        export_addr:
          ip: "0.0.0.0"
          port: 9091
---
# APISIX Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: apisix
spec:
  replicas: 3
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: /apisix/prometheus/metrics
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - apisix
                topologyKey: kubernetes.io/hostname
      containers:
        - name: apisix
          image: apache/apisix:3.8.0-debian
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 9443
              name: https
            - containerPort: 9091
              name: prometheus
          env:
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-credentials
                  key: admin-key
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: "1"
          volumeMounts:
            - name: config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
          livenessProbe:
            httpGet:
              path: /apisix/status
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /apisix/status
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: apisix-config
---
# APISIX Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-dashboard
  namespace: apisix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apisix-dashboard
  template:
    metadata:
      labels:
        app: apisix-dashboard
    spec:
      containers:
        - name: dashboard
          image: apache/apisix-dashboard:3.0.1-alpine
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: APISIX_DASHBOARD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apisix-credentials
                  key: dashboard-password
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
# APISIX Service
apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: apisix
spec:
  selector:
    app: apisix
  ports:
    - name: http
      port: 80
      targetPort: 9080
    - name: https
      port: 443
      targetPort: 9443
  type: LoadBalancer
---
# APISIX Dashboard Service
apiVersion: v1
kind: Service
metadata:
  name: apisix-dashboard
  namespace: apisix
spec:
  selector:
    app: apisix-dashboard
  ports:
    - name: http
      port: 9000
      targetPort: 9000
  type: ClusterIP
---
# APISIX Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: apisix-credentials
  namespace: apisix
type: Opaque
stringData:
  admin-key: "${APISIX_ADMIN_KEY}"
  dashboard-password: "${APISIX_DASHBOARD_PASSWORD}"
---
# Pod Disruption Budgets
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix-pdb
  namespace: apisix
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: apisix
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etcd-pdb
  namespace: apisix
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: etcd
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apisix-hpa
  namespace: apisix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apisix
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
